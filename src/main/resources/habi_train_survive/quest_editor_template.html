<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>任务编辑器 · Habi Train Survive</title>
<!--
  设计契约（本文件唯一界面来源，无外部 CSS/JS/字体/图片）
  定位：离线单文件的任务配置管理工具，供服务器管理员在桌面上批量编辑并导出 quests.json。
  语义色：--accent 主操作/选中；--ok 成功；--warn 校验警告；--danger 错误/删除；--surface 面板；--sidebar 导航。
  字体：系统中文无衬线（正文 13px，标题 14–18px，ID/数值使用等宽字体）。
  节奏：间距 4/8/12/16/20/24/32，圆角 6/10/14，阴影仅两级。
  动效：120ms 用于悬停/按压，200ms 用于面板与弹层（cubic-bezier，非线性）；尊重 prefers-reduced-motion。
  规则：所有可点击元素使用原生 button/input/select；键盘焦点必须可见；状态用内联状态条与问题面板表达，不用 alert 作为唯一反馈。
-->
<script>window.QUEST_BUNDLE = /*__QUEST_BUNDLE__*/null;</script>
<style>
:root{
  color-scheme: light;
  --bg:#eef1f6;
  --surface:#ffffff;
  --surface-2:#f7f9fc;
  --surface-3:#eaeff6;
  --sidebar:#0f1823;
  --sidebar-2:#18242f;
  --sidebar-3:#1d3145;
  --sidebar-line:#243240;
  --line:#dde4ec;
  --line-strong:#c3cedb;
  --text:#111a24;
  --muted:#5a6b7d;
  --faint:#8898a9;
  --inv:#e9eff6;
  --inv-muted:#93a6ba;
  --accent:#1f6fd0;
  --accent-hover:#185ab0;
  --accent-soft:#e8f1fc;
  --ok:#16724a;
  --ok-soft:#e6f5ed;
  --warn:#986000;
  --warn-soft:#fdf4de;
  --danger:#b92f2a;
  --danger-soft:#fdeceb;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:14px;
  --shadow-1:0 1px 2px rgba(16,24,34,.06);
  --shadow-2:0 14px 34px -16px rgba(16,24,34,.4);
  --t-fast:120ms cubic-bezier(.2,.9,.3,1);
  --t:200ms cubic-bezier(.2,.9,.25,1);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:13px;line-height:1.5;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:var(--mono)}
h1,h2,h3,p{margin:0}
ul,ol{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar :focus-visible{outline-color:#8dbcf5}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg{display:block;flex:0 0 auto}
[hidden]{display:none!important}

/* ---------- 框架 ---------- */
.app{display:flex;flex-direction:column;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,#2569c9,#123f78);color:#eaf2ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text strong{font-size:14px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand-text span{font-size:11px;color:var(--muted);white-space:nowrap}
.topbar-meta{display:flex;align-items:center;gap:6px;margin-left:6px;flex-wrap:wrap;min-width:0}
.meta-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap}
.meta-chip b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.draft-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.draft-chip[data-dirty="1"]{background:var(--warn-soft);border-color:#ecd7a6;color:#7d5200}
.draft-chip .dot{width:6px;height:6px;border-radius:50%;background:#9fb0c2}
.draft-chip[data-dirty="1"] .dot{background:#d08a00}

/* 内联状态条 */
.statusbar{display:flex;align-items:center;gap:8px;padding:7px 16px;min-height:34px;font-size:12px;background:var(--surface-2);border-bottom:1px solid var(--line);color:var(--muted);flex:0 0 auto;transition:background-color var(--t),color var(--t)}
.statusbar[data-tone="ok"]{background:var(--ok-soft);color:#12583a;border-bottom-color:#c4e5d1}
.statusbar[data-tone="warn"]{background:var(--warn-soft);color:#7a5000;border-bottom-color:#eeddb3}
.statusbar[data-tone="err"]{background:var(--danger-soft);color:#8f1f1b;border-bottom-color:#f0c3bf}
.statusbar .status-icon{display:flex;align-items:center;color:currentColor}
.statusbar .status-text{min-width:0;overflow-wrap:anywhere}
.notice{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#eef4fd;border-bottom:1px solid #d3e2f6;font-size:12px;color:#23496f;flex:0 0 auto;flex-wrap:wrap}
.notice strong{font-weight:600}
.notice .btn{margin-left:auto}

/* 三栏 */
.shell{display:grid;grid-template-columns:274px minmax(0,1fr) 344px;flex:1 1 auto;min-height:0}
body.issues-closed .shell{grid-template-columns:274px minmax(0,1fr)}
body.issues-closed .issues{display:none}
.sidebar{background:var(--sidebar);color:var(--inv);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;border-right:1px solid #0a1017}
.side-search{position:sticky;top:0;z-index:5;padding:12px;background:var(--sidebar);border-bottom:1px solid var(--sidebar-line)}
.side-input{width:100%;height:32px;padding:0 10px;border-radius:var(--radius-s);border:1px solid #2b3b4c;background:#16212c;color:var(--inv);font-size:12px;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.side-input::placeholder{color:#7d8fa2}
.side-input:focus{border-color:#4f86c4;box-shadow:0 0 0 3px rgba(94,146,204,.22);outline:none}
.nav{padding:6px 8px 16px;flex:1 1 auto}
.nav-group{padding:6px 0 2px}
.nav-group-head{display:flex;align-items:center;gap:8px;padding:4px 8px 6px;color:var(--inv-muted);font-size:11px;letter-spacing:.04em;text-transform:none}
.nav-group-head .nav-group-title{font-weight:600}
.nav-group-head .badge{margin-left:auto}
.nav-group-note{font-size:10px;color:#7e93a8;font-variant-numeric:tabular-nums;white-space:nowrap}
.nav-settings{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--inv);cursor:pointer;text-align:left;font-size:13px;transition:background-color var(--t-fast),border-color var(--t-fast)}
.nav-settings:hover{background:var(--sidebar-2)}
.nav-settings.is-active{background:var(--sidebar-3);border-color:#2e5177}
.nav-settings svg{color:#8fb3d9}
.nav-settings .nav-note{margin-left:auto;font-size:10px;color:#93a7bb;font-variant-numeric:tabular-nums}
.nav-row{position:relative;display:flex;align-items:stretch;border-radius:8px;border:1px solid transparent;margin-bottom:2px;transition:background-color var(--t-fast),border-color var(--t-fast)}
.nav-row:hover{background:var(--sidebar-2)}
.nav-row.is-active{background:var(--sidebar-3);border-color:#2e5177}
.nav-row.is-confirm{background:#2a1d1d;border-color:#5d3030}
.nav-main{flex:1 1 auto;min-width:0;display:block;padding:6px 8px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;border-radius:8px}
.nav-title{display:block;font-size:12.5px;color:#e7eef6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sub{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:10.5px;color:#8498ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sub code{font-size:10px;color:#9fb3c6}
.row-actions{display:flex;align-items:center;gap:0;padding:0 2px;opacity:.22;transition:opacity var(--t-fast)}
.nav-row:hover .row-actions,.nav-row:focus-within .row-actions{opacity:1}
.row-confirm{display:flex;align-items:center;gap:4px;padding:0 4px}
.nav-empty{padding:5px 10px 8px;font-size:11.5px;color:#7d90a4;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.nav-empty .btn{color:#b9cde0}
.nav-empty .btn:hover{background:#22303f;color:#fff}
.nav-divider{height:1px;margin:6px 8px;background:var(--sidebar-line)}
.side-foot{padding:12px;border-top:1px solid var(--sidebar-line);font-size:11px;line-height:1.6;color:#7d90a4;background:#0c141d}
.side-foot code{color:#a8bccf}

.main{overflow-y:auto;padding:20px 24px 56px;min-width:0;background:var(--bg);scroll-behavior:auto}
.pane{max-width:1020px;margin:0 auto}
.pane-head{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
.pane-title{min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.pane-title h2{font-size:20px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.pane-sub{margin-top:5px;font-size:12px;color:var(--muted);max-width:64ch}
.pane-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12px}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{color:var(--faint)}

/* ---------- 卡片与表单 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow-1);margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-head .hint{font-size:11px;color:var(--muted);font-weight:400}
.card-body{padding:16px}
.card-body > * + *{margin-top:14px}
.badge{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--muted);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.sidebar .badge{background:#22303f;color:#b7c9db}
.hint{font-size:11px;color:var(--muted)}
.subtle{color:var(--faint);font-size:11px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field-block{grid-column:1/-1;margin-top:14px;display:flex}
.field-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#39485a;min-height:16px}
.field-label em{font-style:normal;font-weight:400;font-size:11px;color:var(--faint)}
.field-hint{font-size:11px;color:var(--muted);line-height:1.45}
.field-hint.is-error{color:var(--danger)}
.field-hint.is-warn{color:var(--warn)}
.input,.select,.textarea{width:100%;min-width:0;border:1px solid var(--line-strong);background:#fff;border-radius:var(--radius-s);height:32px;padding:0 10px;font-size:13px;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.input.mono{font-family:var(--mono);font-size:12px}
.textarea{height:auto;min-height:70px;padding:8px 10px;line-height:1.55;resize:vertical}
.input:hover,.select:hover,.textarea:hover{border-color:#a9b7c7}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,208,.16);outline:none}
.input.is-invalid,.select.is-invalid{border-color:#d78079;box-shadow:0 0 0 3px rgba(185,47,42,.1)}
.input:disabled,.select:disabled{background:var(--surface-2);color:var(--faint);cursor:not-allowed}
.static-value{margin:0;padding:7px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);font-size:12px;color:var(--muted);min-height:32px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line-strong);background:#fff;color:var(--text);border-radius:var(--radius-s);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast),transform var(--t-fast),box-shadow var(--t-fast)}
.btn:hover{background:var(--surface-2);border-color:#adbccb}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text);border-color:transparent}
.btn.danger{color:var(--danger);border-color:#e6b7b2;background:#fff}
.btn.danger:hover{background:var(--danger-soft);border-color:#dd9a94}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.xs{height:23px;padding:0 7px;font-size:11px;border-radius:5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.has-errors{border-color:#e6b7b2;color:var(--danger);background:var(--danger-soft)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid transparent;background:transparent;border-radius:var(--radius-s);color:var(--muted);cursor:pointer;transition:background-color var(--t-fast),color var(--t-fast),transform var(--t-fast)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn:active{transform:translateY(1px)}
.icon-btn.xs{width:22px;height:22px;border-radius:4px}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.sidebar .icon-btn{color:#8ea3b8}
.sidebar .icon-btn:hover{background:#233342;color:#fff}
.sidebar .icon-btn.danger:hover{background:#3a2224;color:#ff9d95}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:#39485a;cursor:pointer;padding:3px 0}
.check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
.check .hint{margin-left:2px}

/* 行式列表（任务/奖励） */
.rows{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:12px;padding:12px 16px;align-items:flex-start;transition:background-color var(--t-fast)}
.row + .row{border-top:1px dashed var(--line)}
.row:hover{background:#fbfcfe}
.row-index{flex:0 0 18px;padding-top:23px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint)}
.row .field-trigger,.row .field-type{flex:1 1 160px;min-width:150px}
.row .field-target{flex:2.4 1 250px;min-width:210px}
.row .field-item{flex:2 1 230px;min-width:200px}
.row .field-amount{flex:0 1 100px;min-width:88px}
.row .field-count{flex:0 1 96px;min-width:84px}
.row .field-display{flex:1.4 1 190px;min-width:160px}
.row-remove{flex:0 0 auto;margin-top:23px}
.none-note{margin:0;padding:7px 10px;min-height:32px;display:flex;align-items:center;border:1px dashed var(--line-strong);border-radius:var(--radius-s);font-size:11.5px;color:var(--muted);background:var(--surface-2)}
.empty-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;font-size:12px;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.empty-inline .btn{margin-left:auto}

/* 图标选择器 + 可搜索下拉 */
.combo{position:relative;display:flex;align-items:center;min-width:0}
.combo .input{padding-right:28px}
.combo-toggle{position:absolute;right:2px;top:2px;width:26px;height:28px;display:grid;place-items:center;border:0;background:transparent;color:var(--faint);border-radius:4px;cursor:pointer}
.combo-toggle:hover{background:var(--surface-3);color:var(--text)}
.combo-list{position:absolute;z-index:60;top:calc(100% + 4px);left:0;right:0;max-height:250px;overflow:auto;padding:4px;background:#fff;border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-2);list-style:none;animation:pop var(--t) both}
.combo-list li[role="option"]{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:5px;font-family:var(--mono);font-size:11.5px;cursor:pointer;overflow-wrap:anywhere}
.combo-list li[role="option"]:hover,.combo-list li.is-active{background:var(--surface-3)}
.combo-list li[aria-selected="true"]{background:var(--accent-soft);color:#123f78}
.combo-list li[aria-selected="true"].is-active{background:#d8e8fb}
.combo-more{display:block;padding:6px 8px;border-top:1px solid var(--line);margin-top:4px;font-size:10.5px;color:var(--faint);font-family:var(--font)}
.combo-empty{display:block;padding:8px;font-size:11.5px;color:var(--muted);font-family:var(--font)}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* 章节概览 / 统计 */
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface-2);min-width:0}
.stat span{font-size:11px;color:var(--muted)}
.stat strong{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat em{font-style:normal;font-size:10.5px;color:var(--faint);overflow-wrap:anywhere}
.steps{margin:0;padding-left:18px;font-size:12px;color:#39485a;display:flex;flex-direction:column;gap:6px}
.steps code,.callout code{padding:1px 5px;background:var(--surface-3);border-radius:4px;font-size:11.5px;overflow-wrap:anywhere}
.callout{margin:0;padding:9px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:11.5px;color:#23496f;line-height:1.6}
.callout.warn{border-left-color:#d39200;background:var(--warn-soft);color:#6e4a00}
.chapter-card{margin-bottom:10px}
.chapter-row{display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.icon-tile{display:grid;place-items:center;width:38px;height:38px;flex:0 0 auto;border-radius:8px;background:linear-gradient(145deg,#e7eff9,#cfe0f3);color:#1c4a7d;font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid #c2d6ec;overflow:hidden}
.chapter-meta{flex:1 1 220px;min-width:0}
.chapter-meta h3{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.chapter-meta .mono{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.chapter-meta .chapter-desc{margin-top:3px;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.chapter-stats{display:flex;gap:6px;flex-wrap:wrap}
.chapter-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:34px 20px;border:1px dashed var(--line-strong);border-radius:var(--radius-m);background:var(--surface-2);color:var(--muted);text-align:center;margin-bottom:16px}
.empty strong{font-size:14px;color:var(--text);font-weight:600}
.empty p{max-width:52ch;font-size:12px}
.empty .btn-row{justify-content:center;margin-top:4px}

/* 网格布局 */
.posgrid-wrap{overflow-x:auto;padding-bottom:2px}
.posgrid{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(34px,1fr));gap:4px;padding:8px;background:var(--surface-3);border:1px solid var(--line);border-radius:8px;min-width:280px}
.gcell{position:relative;min-height:44px;display:flex;flex-direction:column;gap:2px;padding:3px;background:#fff;border:1px solid var(--line);border-radius:5px;transition:background-color var(--t-fast),border-color var(--t-fast)}
.gcell.is-over{background:#dcebfb;border-color:#7fa9d8}
.gcell:empty::after{content:attr(data-coord);margin:auto;font-family:var(--mono);font-size:9px;color:#c3cedb}
.gchip{display:block;width:100%;max-width:100%;padding:2px 4px;border:1px solid #b8d0ec;background:#e8f0fa;color:#174a7c;border-radius:4px;font-size:10px;line-height:1.25;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;transition:background-color var(--t-fast),border-color var(--t-fast)}
.gchip:hover{background:#d8e8fb;border-color:#7fa9d8}
.gchip.is-picked{outline:2px solid var(--accent);outline-offset:1px}
.gchip.is-hidden{opacity:.55;text-decoration:line-through}
.grid-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}

/* 章节任务卡片 */
.qcard{border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);margin-bottom:10px;box-shadow:var(--shadow-1);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.qcard:hover{border-color:#b9c8d8}
.qcard-head{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;flex-wrap:wrap}
.qcard-main{flex:1 1 240px;min-width:0}
.qcard-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qcard-title strong{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.qcard-title code{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.qcard-desc{margin-top:3px;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.qcard-badges{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px}
.qcard-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.qcard-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;border-top:1px dashed var(--line);background:var(--surface-2);border-radius:0 0 var(--radius-m) var(--radius-m);font-size:11.5px;color:var(--muted)}
.qcard-foot label{display:flex;align-items:center;gap:5px}
.qcard-foot .input{width:66px;height:26px;padding:0 6px;font-size:12px}
.qcard-foot .pos-note{font-family:var(--mono);font-size:11px;color:var(--faint)}
.qcard-foot .spacer{flex:1 1 auto}
.qcard-foot .hint{max-width:48ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-body .qcard:last-child{margin-bottom:0}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--surface-3);color:var(--muted);font-size:10.5px;white-space:nowrap}
.tag.hidden{background:var(--warn-soft);color:#7d5200}
.tag.chain{background:var(--accent-soft);color:#1b4f86}

/* 前置依赖 */
.req-box{display:flex;flex-direction:column;gap:10px}
.req-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.req-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 4px 0 8px;border-radius:999px;background:var(--accent-soft);border:1px solid #c8ddf5;color:#174a7c;font-size:11px;max-width:100%}
.req-chip code{font-size:10.5px;overflow-wrap:anywhere}
.req-chip button{display:grid;place-items:center;width:16px;height:16px;border:0;border-radius:50%;background:rgba(23,74,124,.08);color:#174a7c;cursor:pointer}
.req-chip button:hover{background:rgba(23,74,124,.2)}
.req-chip.unknown{background:var(--danger-soft);border-color:#ebc0bb;color:#8f1f1b}
.req-chip.unknown button{background:rgba(143,31,27,.08);color:#8f1f1b}
.req-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req-tools .input{flex:1 1 200px}
.req-list{max-height:196px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface-2);padding:6px}
.req-opt{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;font-size:11.5px;cursor:pointer;min-width:0}
.req-opt:hover{background:#fff}
.req-opt input{width:14px;height:14px;accent-color:var(--accent);margin:0;flex:0 0 auto}
.req-opt .req-title{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-opt .req-title code{font-size:10.5px;color:var(--muted);margin-left:4px}
.req-opt .tag{flex:0 0 auto}
.req-opt.is-hidden{display:none}
.req-opt.is-cycle{opacity:.55}
.req-empty{padding:8px;font-size:11.5px;color:var(--muted)}

/* 问题面板 */
.issues{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.issues-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.issues-head h2{font-size:13px;font-weight:600}
.issues-head .badge{margin-left:auto}
.issues-list{padding:10px 12px 24px;overflow-y:auto}
.issue-group{margin-bottom:12px}
.issue-group-head{display:flex;align-items:center;gap:6px;padding:4px 2px 6px;font-size:11px;font-weight:600;color:var(--muted)}
.issue-group-head .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.issue-group-head .dot.err{background:var(--danger)}
.issue{display:flex;align-items:flex-start;gap:8px;width:100%;margin-bottom:6px;padding:8px 9px;text-align:left;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;background:var(--surface-2);cursor:pointer;transition:background-color var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
.issue:hover{background:#fff;border-color:var(--line-strong);border-left-color:var(--warn)}
.issue:active{transform:translateY(1px)}
.issue.error{border-left-color:var(--danger);background:var(--danger-soft)}
.issue.error:hover{background:#fce3e1}
.issue .issue-icon{color:var(--warn);margin-top:1px}
.issue.error .issue-icon{color:var(--danger)}
.issue .issue-body{flex:1 1 auto;min-width:0}
.issue .issue-msg{display:block;font-size:11.5px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.issue .issue-loc{display:block;margin-top:2px;font-size:10.5px;color:var(--muted);font-family:var(--mono);overflow-wrap:anywhere}
.issues-empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12px}
.issues-empty svg{margin:0 auto 8px;color:var(--ok)}

/* 弹层 / 遮罩 */
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(10,18,26,.42);z-index:70;animation:fade var(--t) both}
body.nav-open .drawer-backdrop{display:block}
#modalRoot{position:relative;z-index:90}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,18,26,.45);display:grid;place-items:center;padding:20px;z-index:90;animation:fade var(--t) both}
.modal{width:min(520px,100%);background:var(--surface);border-radius:var(--radius-l);border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(10,18,26,.6);animation:modalIn var(--t) both}
.modal-head{padding:16px 18px 0}
.modal-head h2{font-size:16px;font-weight:600}
.modal-body{padding:8px 18px 16px;font-size:12.5px;color:#39485a;line-height:1.6;overflow-wrap:anywhere}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius-l) var(--radius-l)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.drop-overlay{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(15,24,35,.55);backdrop-filter:blur(2px);animation:fade var(--t-fast) both}
.drop-overlay div{display:flex;flex-direction:column;gap:4px;align-items:center;padding:28px 40px;border:2px dashed #9fc4ec;border-radius:var(--radius-l);background:#fff;color:#174a7c}
.drop-overlay strong{font-size:15px}
.drop-overlay span{font-size:12px;color:var(--muted)}

/* 新元素入场（一次性，不装饰持续状态） */
.enter{animation:enter var(--t) both}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.is-target{box-shadow:0 0 0 3px rgba(31,111,208,.35)!important;border-radius:var(--radius-s)}

/* 滚动条 */
*{scrollbar-width:thin;scrollbar-color:#b9c6d4 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c4d0dd;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:#2b3b4c;background-clip:padding-box}

/* ---------- 响应式 ---------- */
@media (max-width:1240px){
  .app{overflow:auto}
  .shell{display:flex;flex-wrap:wrap;flex:0 0 auto;min-height:0}
  .sidebar{width:258px;overflow:visible}
  .main{flex:1 1 520px;overflow:visible}
  .issues{flex:1 1 100%;border-left:0;border-top:1px solid var(--line);max-height:none}
  .issues-list{overflow:visible}
}
@media (max-width:1024px){
  .app{overflow:auto}
  .brand-text span{display:none}
  .topbar-meta{display:none}
  .shell{display:block}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:86vw;z-index:80;transform:translateX(-102%);transition:transform var(--t);box-shadow:var(--shadow-2)}
  body.nav-open .sidebar{transform:none}
  .nav-toggle{display:inline-flex}
  .main{padding:16px 16px 40px;overflow:visible}
  .issues{max-height:none;border-top:1px solid var(--line)}
  body.issues-closed .shell{display:block}
  .issues-list{overflow:visible}
}
@media (min-width:1025px){.nav-toggle{display:none}}
@media (max-width:720px){
  .topbar{padding:8px 10px;gap:8px;flex-wrap:wrap}
  .topbar-actions{gap:4px}
  .topbar-actions .btn{padding:0 8px}
  .draft-chip{display:none}
  .form-grid,.form-grid.cols-3,.overview{grid-template-columns:1fr}
  .overview{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pane-title h2{font-size:18px}
  .row{padding:12px}
  .row .field-trigger,.row .field-target,.row .field-item,.row .field-display,.row .field-amount,.row .field-count{flex:1 1 100%;min-width:0}
  .row-index{display:none}
  .row-remove{margin-top:0}
  .qcard-actions{margin-left:0}
  .chapter-actions{width:100%;margin-left:0;justify-content:flex-end}
}
@media (max-width:560px){
  .btn-label{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar" data-icon="menu"></button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true" data-icon="scroll"></span>
      <span class="brand-text"><strong>任务编辑器</strong><span>Habi Train Survive · 离线单文件</span></span>
    </div>
    <div class="topbar-meta" id="metaCounts"></div>
    <div class="topbar-actions">
      <span class="draft-chip" id="draftChip" data-dirty="0"><span class="dot" aria-hidden="true"></span><span id="draftText">草稿未保存</span></span>
      <button class="btn sm" id="btnCopy" data-action="copy" title="复制完整 quests.json 到剪贴板"><span data-icon="copy"></span><span class="btn-label">复制 JSON</span></button>
      <button class="btn sm" id="btnImport" data-action="import" title="选择本地 quests.json 导入"><span data-icon="upload"></span><span class="btn-label">导入</span></button>
      <button class="btn sm primary" id="btnExport" data-action="export" title="下载 quests.json"><span data-icon="download"></span><span class="btn-label">导出 quests.json</span></button>
      <button class="btn sm primary" id="btnOnlineSave" data-action="online-save" title="校验并直接保存回服务器的 quests.json" hidden><span data-icon="check"></span><span class="btn-label">保存到服务器</span></button>
      <button class="btn sm" id="issuesToggle" aria-expanded="true" aria-controls="issuesPanel" title="显示或隐藏校验问题面板"><span data-icon="warning"></span><span class="btn-label">问题</span><span class="badge" id="issuesCount">0</span></button>
    </div>
  </header>
  <div class="statusbar" id="statusbar" role="status" aria-live="polite" data-tone="info">
    <span class="status-icon" id="statusIcon" data-icon="info"></span>
    <span class="status-text" id="statusText">正在载入编辑器…</span>
  </div>
  <div class="notice" id="notice" hidden>
    <span data-icon="warning"></span>
    <span id="noticeText"></span>
    <button class="btn xs" data-action="discard-draft">放弃本地草稿，重新载入服务器数据</button>
    <button class="btn xs ghost" data-action="dismiss-notice" aria-label="关闭提示">关闭</button>
  </div>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="任务导航">
      <div class="side-search">
        <label class="visually-hidden" for="searchInput">搜索任务或章节</label>
        <input id="searchInput" class="side-input" type="search" placeholder="搜索标题或 ID" autocomplete="off" spellcheck="false">
      </div>
      <nav id="nav" class="nav" aria-label="任务列表"></nav>
      <div class="side-foot">
        完全离线：不发任何网络请求。编辑内容自动保存在本浏览器草稿中。导出后请覆盖服务器
        <code>config/habi_train_survive/quests.json</code> 并执行 <code>/quest reload</code>。
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
    <aside class="issues" id="issuesPanel" aria-label="校验问题">
      <div class="issues-head">
        <h2>校验问题</h2>
        <span class="badge" id="issuesCount2">0</span>
      </div>
      <div class="issues-list" id="issuesList"></div>
    </aside>
  </div>
  <div class="drawer-backdrop" id="backdrop"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
  <div class="drop-overlay" id="dropOverlay" hidden>
    <div><strong>松开以导入 quests.json</strong><span>将替换当前编辑内容（草稿已自动保存）</span></div>
  </div>
  <div id="modalRoot"></div>
</div>
<script>

function questIdSet(){

function makeTask(type){

}
function makeQuest(kind){

    title: '新任务', description: '', icon: defaultIcon(),
    tasks: [makeTask('mine_block')],

}
function makeChapterQuest(ch){
  var pos = nextFreePosition(ch);
  var q = normQuest({
    id: uniqueQuestId('chapter_quest'),
    title: '新章节任务', description: '', icon: defaultIcon(),
    tasks: [makeTask('mine_block')],

}

}
function nextFreePosition(ch){
  var used = Object.create(null);
  ch.quests.forEach(function(q){ used[numAttr(q.x) + ',' + numAttr(q.y)] = 1; });
  var x = 0, y = 0, guard = 0;
  while(used[x + ',' + y] && guard < 400){ x++; if(x > 5){ x = 0; y++; } guard++; }
  return { x:x, y:y };
}
function cleanupRequires(ids){
  var set = Object.create(null), count = 0;
  ids.forEach(function(id){ set[id] = 1; });
  state.chapters.forEach(function(ch){
    ch.quests.forEach(function(q){
      var kept = q.requires.filter(function(r){ if(set[r]){ count++; return false; } return true; });
      q.requires = kept;
    });
  });
  return count;
}
function collectRequires(ch){ return (ch.quests || []).reduce(function(a,q){ return a.concat(q.requires || []); }, []); }

function addNew(kind){
  if(kind === 'daily' || kind === 'weekly'){

    state[kind].push(q);

    state.ui.dirty = true;
    renderAll(true);

function duplicateQuest(arr, index, chapterIndex){
  var q = arr[index];
  if(!q) return;
  var copy = clone(q);
  copy.id = uniqueQuestId((q.id || 'quest') + '_copy');
  copy.title = (q.title || '未命名任务') + ' 副本';
  copy.requires = [];
  copy._extra = clone(q._extra || {});
  arr.splice(index + 1, 0, copy);
  if(chapterIndex == null){
    state.ui.sel = { kind: arr === state.daily ? 'daily' : 'weekly', index:index + 1 };
  } else {
    state.ui.sel = { kind:'cq', chapter:chapterIndex, index:index + 1 };
  }
  state.ui.dirty = true;
  renderAll(true);
  saveDraftNow();
  flash('已复制任务，请检查新 ID', 'ok');
}
function deleteQuest(arr, index, kind, chapterIndex){
  var q = arr[index];
  if(!q) return;
  arr.splice(index, 1);
  var cleaned = q.id ? cleanupRequires([q.id]) : 0;
  if(chapterIndex == null){
    if(state.ui.sel.kind === kind && state.ui.sel.index === index){
      state.ui.sel = arr.length ? { kind:kind, index:Math.min(index, arr.length - 1) } : { kind:'settings' };
    } else if(state.ui.sel.kind === kind && state.ui.sel.index > index){
      state.ui.sel.index--;
    }
  } else {
    if(state.ui.sel.kind === 'cq' && state.ui.sel.chapter === chapterIndex){
      if(state.ui.sel.index === index){ state.ui.sel = { kind:'chapter', index:chapterIndex }; }
      else if(state.ui.sel.index > index){ state.ui.sel.index--; }
    }
  }
  state.ui.dirty = true;
  renderAll(true);
  saveDraftNow();
  flash('已删除任务“' + (q.title || q.id || '未命名') + '”' + (cleaned ? '，并清理 ' + cleaned + ' 处前置依赖' : ''), 'ok');
}
function moveItem(arr, index, delta){
  var j = index + delta;
  if(j < 0 || j >= arr.length) return false;
  var tmp = arr[index]; arr[index] = arr[j]; arr[j] = tmp;
  return true;
}
function moveQuest(kind, index, delta, chapterIndex){
  var arr = chapterIndex == null ? state[kind] : state.chapters[chapterIndex].quests;
  if(!moveItem(arr, index, delta)) return;
  if(chapterIndex == null){
    if(state.ui.sel.kind === kind){
      if(state.ui.sel.index === index) state.ui.sel.index += delta;
      else if(state.ui.sel.index === index + delta) state.ui.sel.index -= delta;
    }
  } else if(state.ui.sel.kind === 'cq' && state.ui.sel.chapter === chapterIndex){
    if(state.ui.sel.index === index) state.ui.sel.index += delta;
    else if(state.ui.sel.index === index + delta) state.ui.sel.index -= delta;
  }
  state.ui.dirty = true;
  renderAll();
  saveDraftNow();
}
function moveChapter(index, delta){
  if(!moveItem(state.chapters, index, delta)) return;
  if(state.ui.sel.kind === 'chapter' && state.ui.sel.index === index) state.ui.sel.index += delta;
  else if(state.ui.sel.kind === 'chapter' && state.ui.sel.index === index + delta) state.ui.sel.index -= delta;
  else if(state.ui.sel.kind === 'cq' && state.ui.sel.chapter === index) state.ui.sel.chapter += delta;
  else if(state.ui.sel.kind === 'cq' && state.ui.sel.chapter === index + delta) state.ui.sel.chapter -= delta;
  state.ui.dirty = true;
  renderAll();
  saveDraftNow();
}
function duplicateChapter(index){
  var ch = state.chapters[index];

  var copy = normChapter(clone(ch));
  copy.id = uniqueChapterId((ch.id || 'chapter') + '_copy');
  copy.title = (ch.title || '未命名章节') + ' 副本';
  copy.quests = copy.quests.map(function(q){

    c.title = (q.title || '未命名任务') + ' 副本';

  html += '<div class="nav-group">' + navGroupHead('weekly', '每周任务', state.weekly.length, '刷新 ' + fmtCount(state.settings.weeklyCount), '新建每周任务');

  html += '<div class="nav-group">' + navGroupHead('chapter', '章节', state.chapters.length, '', '新建章节');
  var chapterRows = state.chapters.map(function(ch, i){ return { ch:ch, i:i }; }).filter(function(e){ return matchesSearch(term, [e.ch.title, e.ch.id]); });

    ICONS.grid + '<span>章节总览</span><span class="nav-note">' + state.chapters.reduce(function(a, c){ return a + c.quests.length; }, 0) + ' 任务</span>' +
  '</button>';
  html += chapterRows.length
    ? chapterRows.map(function(e){ return navRow('chapter', e.i, e.ch); }).join('')
    : '<div class="nav-empty">' + (term ? '没有匹配的章节' : '还没有章节') + '</div>';
  html += '</div>';

  html += '<div class="nav-divider"></div>' +
    '<div class="nav-group-head"><span class="nav-group-title">数据</span></div>' +
    '<button class="nav-settings" type="button" data-action="import">' + ICONS.upload + '<span>导入 quests.json</span></button>' +
    '<button class="nav-settings" type="button" data-action="export">' + ICONS.download + '<span>导出 quests.json</span></button>';

  navEl.innerHTML = html;

/* ============================================================
   渲染：外壳与主面板
   ============================================================ */
function renderAll(resetScroll){
  renderNav();
  renderMain(resetScroll);
  renderMeta();
  renderIssues();
}
function renderMeta(){
  var qCount = state.chapters.reduce(function(a, c){ return a + c.quests.length; }, 0);
  $('#metaCounts').innerHTML =
    '<span class="meta-chip">每日 <b>' + state.daily.length + '</b></span>' +
    '<span class="meta-chip">每周 <b>' + state.weekly.length + '</b></span>' +
    '<span class="meta-chip">章节 <b>' + state.chapters.length + '</b> · 任务 <b>' + qCount + '</b></span>';
}
function paneHead(eyebrow, title, sub, actions){
  return '<header class="pane-head">' +
    '<div class="pane-title">' +
      '<p class="eyebrow">' + esc(eyebrow) + '</p>' +
      '<h2>' + esc(title) + '</h2>' +
      (sub ? '<p class="pane-sub">' + sub + '</p>' : '') +
    '</div>' +
    (actions ? '<div class="pane-actions">' + actions + '</div>' : '') +
  '</header>';
}
function renderMain(resetScroll){
  var sel = state.ui.sel, html = '';
  if(sel.kind === 'settings'){ html = settingsView(); }
  else if(sel.kind === 'daily' || sel.kind === 'weekly'){
    var arr = state[sel.kind];
    if(!arr[sel.index]){ state.ui.sel = { kind:'settings' }; html = settingsView(); }
    else html = questView(sel, arr[sel.index]);
  }
  else if(sel.kind === 'chapters'){ html = chaptersView(); }
  else if(sel.kind === 'chapter'){
    if(!state.chapters[sel.index]){ state.ui.sel = { kind:'chapters' }; html = chaptersView(); }
    else html = chapterView(sel.index, state.chapters[sel.index]);
  }
  else if(sel.kind === 'cq'){
    var ch = state.chapters[sel.chapter];
    if(!ch || !ch.quests[sel.index]){ state.ui.sel = ch ? { kind:'chapter', index:sel.chapter } : { kind:'chapters' }; html = ch ? chapterView(sel.chapter, ch) : chaptersView(); }
    else html = questView(sel, ch.quests[sel.index]);
  }
  else { state.ui.sel = { kind:'settings' }; html = settingsView(); }
  mainEl.innerHTML = html;
  if(resetScroll) mainEl.scrollTop = 0;
  updateSettingsHints();
}

/* ============================================================

function countHint(kind){
  var len = kind === 'daily' ? state.daily.length : state.weekly.length;
  var value = kind === 'daily' ? state.settings.dailyCount : state.settings.weeklyCount;
  var label = kind === 'daily' ? '每日' : '每周';
  if(!len) return '模板为空；刷新数量必须为 0';
  if(!isFinite(value)) return '模板 ' + len + ' 条；请输入刷新数量';
  if(value > len) return '模板 ' + len + ' 条；刷新数量不能超过模板数量';
  if(value === 0) return '模板 ' + len + ' 条；刷新数量不能为 0';
  return '模板 ' + len + ' 条；每次刷新抽取 ' + value + ' 条';
}
function bundleMetaText(){
  if(!BUNDLE) return '未注入服务器数据（直接打开模板）';
  var at = toStr(BUNDLE.generatedAt);
  return at ? ('服务器数据生成于 ' + at) : '已注入服务器数据';
}

    (empty ? '<div class="empty"><strong>当前没有任务数据</strong><p>可以导入服务器导出的 quests.json，或插入一组示例任务（每日 5 / 每周 5 / 1 个章节）快速开始。示例数据会标注“示例 ·”。</p><div class="btn-row"><button class="btn sm primary" type="button" data-action="import">导入 quests.json</button><button class="btn sm" type="button" data-action="sample">插入示例任务</button></div></div>' : '');

  html += '<section class="card" data-ctx="settings">' +
    '<div class="card-head"><h3>刷新设置</h3><span class="hint">' + esc(bundleMetaText()) + '</span></div>' +

      '<div class="form-grid">' +
        '<label class="field"><span class="field-label">每日刷新数量</span>' +
          '<input class="input" type="number" min="0" step="1" data-field="dailyCount" data-focus="dailyCount" max="45" value="' + numAttr(state.settings.dailyCount) + '">' +
          '<span class="field-hint" id="dailyCountHint">' + esc(countHint('daily')) + '</span></label>' +
        '<label class="field"><span class="field-label">每周刷新数量</span>' +
          '<input class="input" type="number" min="0" step="1" data-field="weeklyCount" data-focus="weeklyCount" max="45" value="' + numAttr(state.settings.weeklyCount) + '">' +
          '<span class="field-hint" id="weeklyCountHint">' + esc(countHint('weekly')) + '</span></label>' +
        '<label class="field"><span class="field-label">刷新时区</span>' +
          '<input class="input mono" type="text" data-field="timeZone" data-focus="timeZone" value="' + esc(state.settings.timeZone) + '" placeholder="Asia/Shanghai" spellcheck="false">' +
          '<span class="field-hint">IANA 时区名称，默认北京时间</span></label>' +
      '</div>' +
    '</div>' +
  '</section>';

  html += '<section class="card">' +

    '<div class="card-body"><div class="overview">' +
      '<div class="stat"><span>每日任务</span><strong>' + state.daily.length + '</strong><em>玩家每天抽 ' + fmtCount(state.settings.dailyCount) + ' 条</em></div>' +
      '<div class="stat"><span>每周任务</span><strong>' + state.weekly.length + '</strong><em>玩家每周抽 ' + fmtCount(state.settings.weeklyCount) + ' 条</em></div>' +
      '<div class="stat"><span>章节</span><strong>' + state.chapters.length + '</strong><em>共 ' + qCount + ' 个章节任务</em></div>' +
      '<div class="stat"><span>时区</span><strong style="font-size:14px;line-height:1.6;overflow-wrap:anywhere">' + esc(state.settings.timeZone || '未设置') + '</strong><em>每日刷新依据</em></div>' +
    '</div></div>' +
  '</section>';

  html += '<section class="card">' +
    '<div class="card-head"><h3>导出与部署</h3><span class="hint">UTF-8 · 2 空格缩进</span></div>' +

      '<div class="btn-row">' +
        '<button class="btn sm" type="button" data-action="save-draft">立即保存草稿</button>' +
        '<button class="btn sm" type="button" data-action="discard-draft">' + (BUNDLE ? '放弃本地草稿，重新载入服务器数据' : '清空并重新开始') + '</button>' +
        '<button class="btn sm ghost" type="button" data-action="clear-draft">删除本地草稿</button>' +
      '</div>' +

    '</div>' +

  html += '</div>';

function updateSettingsHints(){

/* ============================================================
   视图：任务表单
   ============================================================ */
function comboHtml(value, registryKey, opts){
  opts = opts || {};
  var id = 'cb' + (++comboSeq);
  return '<div class="combo" data-combo>' +
    '<input class="input mono combo-input" id="' + id + '" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="' + id + '-list" ' +
      'value="' + esc(value) + '" placeholder="' + esc(opts.placeholder || '搜索或输入 ID') + '" spellcheck="false" autocomplete="off" ' +
      'data-registry="' + registryKey + '" ' +
      (opts.field ? 'data-field="' + opts.field + '" ' : '') +
      (opts.scope ? 'data-scope="' + opts.scope + '" data-index="' + opts.index + '" ' : '') +
      (opts.focus ? 'data-focus="' + opts.focus + '" ' : '') +
      (opts.ariaLabel ? 'aria-label="' + esc(opts.ariaLabel) + '" ' : '') +
      '>' +
    '<button class="combo-toggle" type="button" tabindex="-1" aria-label="浏览 ' + (registryKey === 'items' ? '物品' : registryKey === 'blocks' ? '方块' : '实体') + '列表">' + ICONS.chevronDown + '</button>' +
    '<ul class="combo-list" id="' + id + '-list" role="listbox" hidden></ul>' +
  '</div>';
}
function triggerOptions(selected){
  var opts = '<option value="">— 选择触发器 —</option>';
  if(selected && !triggerMap[selected]){ opts += '<option value="' + esc(selected) + '" selected>未知触发器：' + esc(selected) + '</option>'; }
  TRIGGERS.forEach(function(t){
    opts += '<option value="' + esc(t.type) + '"' + (t.type === selected ? ' selected' : '') + '>' + esc(t.label) + '</option>';
  });
  return opts;
}
function rewardOptions(selected){
  var opts = '';
  if(selected && !rewardTypeMap[selected]){ opts += '<option value="' + esc(selected) + '" selected>未知类型：' + esc(selected) + '</option>'; }
  REWARD_TYPES.forEach(function(r){
    opts += '<option value="' + esc(r.type) + '"' + (r.type === selected ? ' selected' : '') + '>' + esc(r.label) + '</option>';
  });
  return opts;
}
function questView(sel, q){
  var ctx = sel.kind === 'cq' ? ('cq:' + sel.chapter + ':' + sel.index) : (sel.kind + ':' + sel.index);
  var chapter = sel.kind === 'cq' ? state.chapters[sel.chapter] : null;
  var eyebrow = sel.kind === 'daily' ? ('每日任务 · 第 ' + (sel.index + 1) + ' 项')
    : sel.kind === 'weekly' ? ('每周任务 · 第 ' + (sel.index + 1) + ' 项')
    : ('章节任务 · 第 ' + (sel.index + 1) + ' 项');
  var crumbs = chapter
    ? '<nav class="crumbs" aria-label="位置"><button type="button" data-action="back-chapter">' + esc(chapter.title || chapter.id || '章节') + '</button><span class="sep">/</span><span>' + esc(q.title || '未命名任务') + '</span></nav>'
    : '';
  var sub = sel.kind === 'cq'
    ? '章节内任务：位置、前置依赖与隐藏状态会写回章节数据。'
    : '每日 / 每周任务导出时不会写入 x、y、requires、hidden。';
  var actions = (sel.kind === 'cq' ? '<button class="btn sm" type="button" data-action="back-chapter">' + ICONS.up + '返回章节</button>' : '') +

    '<button class="btn sm danger" type="button" data-action="del-quest">' + ICONS.trash + '删除</button>';

  return '<div class="pane" data-ctx="' + ctx + '">' + crumbs +
    paneHead(eyebrow, q.title || '（未命名任务）', sub, actions) +
    basicCard(q, sel) +
    tasksCard(q) +
    rewardsCard(q) +
    (sel.kind === 'cq' ? layoutCard(q, sel) : '') +
  '</div>';
}
function basicCard(q, sel){
  return '<section class="card">' +
    '<div class="card-head"><h3>基本信息</h3><span class="hint">ID 全局唯一；图标取自 registry.items，也可直接手填</span></div>' +
    '<div class="card-body">' +
      '<div class="form-grid">' +
        '<label class="field"><span class="field-label">任务 ID</span>' +
          '<input class="input mono" type="text" data-field="id" data-focus="id" value="' + esc(q.id) + '" placeholder="例如 daily_mine_logs" spellcheck="false" autocomplete="off">' +
          '<span class="field-hint">导出后不要随意更名，玩家进度按 ID 保存。</span></label>' +

          '<span class="field-hint">当前：' + esc(q.icon || '未设置') + '</span></div>' +
        '<div class="field"><span class="field-label">组成</span>' +
          '<p class="static-value">' + q.tasks.length + ' 个任务目标 · ' + q.rewards.length + ' 个奖励</p>' +
          '<span class="field-hint">至少各一项才能通过校验</span></div>' +

    '</div>' +
  '</section>';

function taskRow(t, i){
  var trig = triggerMap[t.type] || null;
  var kind = trig ? trig.targetKind : 'ITEM';
  var targetCell;
  if(kind === 'NONE'){
    targetCell = '<div class="field field-target"><span class="field-label">目标</span><p class="none-note">该触发器无需目标，数量单位为秒</p></div>';
  } else {
    targetCell = '<div class="field field-target"><span class="field-label">目标 <span class="subtle mono">' + kindLabel(kind) + '</span></span>' +
      comboHtml(t.target, registryKeyForKind(kind), {
        scope:'tasks', index:i, field:'target', focus:'task-' + i + '-target',
        ariaLabel:'第 ' + (i + 1) + ' 项目标' + kindLabel(kind) + ' ID',
        placeholder: trig && trig.targetHint ? trig.targetHint : '物品 ID、#标签或 *'
      }) +
      '<span class="field-hint">' + esc((trig && trig.targetHint) || '支持 #标签 与 *') + '</span></div>';
  }

    '<div class="row-index">' + (i + 1) + '</div>' +
    '<div class="field field-trigger"><span class="field-label">触发器</span>' +
      '<select class="select" data-scope="tasks" data-index="' + i + '" data-field="type" data-focus="task-' + i + '-type" aria-label="第 ' + (i + 1) + ' 项目标的触发器">' + triggerOptions(t.type) + '</select></div>' +
    targetCell +
    '<div class="field field-amount"><span class="field-label">数量</span>' +
      '<input class="input" type="number" min="1" step="1" data-scope="tasks" data-index="' + i + '" data-field="amount" data-focus="task-' + i + '-amount" value="' + numAttr(t.amount) + '" aria-label="第 ' + (i + 1) + ' 项目标数量"></div>' +
    '<div class="field field-display"><span class="field-label">描述 <em>可选</em></span>' +
      '<input class="input" type="text" data-scope="tasks" data-index="' + i + '" data-field="display" value="' + esc(t.display) + '" placeholder="玩家看到的目标说明" aria-label="第 ' + (i + 1) + ' 项目标描述"></div>' +
    '<button class="icon-btn danger row-remove" type="button" data-remove-task="' + i + '" aria-label="删除第 ' + (i + 1) + ' 项目标" title="删除该目标">' + ICONS.trash + '</button>' +

function tasksCard(q){
  var body = q.tasks.length
    ? '<div class="rows">' + q.tasks.map(function(t, i){ return taskRow(t, i); }).join('') + '</div>'
    : '<div class="empty-inline">还没有任务目标，至少需要一项才能导出。<button class="btn sm" type="button" data-action="add-task" data-focus="add-task">添加第一项目标</button></div>';

    '<div class="card-head"><h3>任务目标 <span class="badge">' + q.tasks.length + '</span></h3>' +
      '<button class="btn sm" type="button" data-action="add-task" data-focus="add-task">' + ICONS.plus + '添加目标</button></div>' +
    body +

}
function rewardRow(r, i){
  var isItem = r.type === 'item';
  var numField = isItem ? 'count' : 'amount';
  var numValue = isItem ? r.count : r.amount;
  var numLabel = r.type === 'coin' ? '金币数量' : r.type === 'xp' ? '经验数量' : '物品数量';
  return '<div class="row reward-row" data-reward-index="' + i + '">' +
    '<div class="row-index">' + (i + 1) + '</div>' +
    '<div class="field field-type"><span class="field-label">奖励类型</span>' +
      '<select class="select" data-scope="rewards" data-index="' + i + '" data-field="type" data-focus="reward-' + i + '-type" aria-label="第 ' + (i + 1) + ' 个奖励类型">' + rewardOptions(r.type) + '</select></div>' +
    '<div class="field field-item"' + (isItem ? '' : ' hidden') + '><span class="field-label">物品</span>' +
      comboHtml(r.item, 'items', { scope:'rewards', index:i, field:'item', focus:'reward-' + i + '-item', ariaLabel:'第 ' + (i + 1) + ' 个奖励物品 ID', placeholder:'搜索物品 ID，可手填' }) +
      '<span class="field-hint">支持 #标签 与 *</span></div>' +
    '<div class="field field-amount field-count"><span class="field-label js-num-label">' + numLabel + '</span>' +
      '<input class="input" type="number" min="1" step="1" data-scope="rewards" data-index="' + i + '" data-field="' + numField + '" data-focus="reward-' + i + '-amount" value="' + numAttr(numValue) + '" aria-label="第 ' + (i + 1) + ' 个奖励数量"></div>' +
    '<button class="icon-btn danger row-remove" type="button" data-remove-reward="' + i + '" aria-label="删除第 ' + (i + 1) + ' 个奖励" title="删除该奖励">' + ICONS.trash + '</button>' +
  '</div>';
}
function rewardsCard(q){
  var body = q.rewards.length
    ? '<div class="rows">' + q.rewards.map(function(r, i){ return rewardRow(r, i); }).join('') + '</div>'

function wouldCycle(startId, targetId){
  if(!startId || !targetId) return false;
  var seen = Object.create(null);
  var stack = [startId];
  while(stack.length){
    var id = stack.pop();
    if(id === targetId) return true;
    if(seen[id]) continue;
    seen[id] = 1;
    var q = findQuestById(id);
    if(q && q.requires) q.requires.forEach(function(r){ stack.push(r); });
  }
  return false;
}

   校验
   ============================================================ */
function inRegistry(kind, id){
  if(!hasRegistry || isTag(id)) return true;
  var key = registryKeyForKind(kind);
  if(!registry[key].length) return true;
  return registrySet[key][id] === 1;
}
function detectCycles(){
  var graph = Object.create(null), stateMap = Object.create(null), cycles = Object.create(null), stack = [];
  state.chapters.forEach(function(ch){
    ch.quests.forEach(function(q){
      if(!graph[q.id]) graph[q.id] = [];
      var arr = graph[q.id];
      (q.requires || []).forEach(function(r){ if(arr.indexOf(r) === -1) arr.push(r); });
    });
  });
  function dfs(id){
    var st = stateMap[id] || 0;
    if(st === 1){
      var idx = stack.indexOf(id);
      var cyc = stack.slice(idx >= 0 ? idx : 0).concat(id);
      cyc.forEach(function(n){ if(!cycles[n]) cycles[n] = cyc.join(' → '); });
      return;
    }
    if(st === 2) return;
    stateMap[id] = 1;
    stack.push(id);
    (graph[id] || []).forEach(function(n){ if(graph[n]) dfs(n); });
    stack.pop();
    stateMap[id] = 2;
  }
  Object.keys(graph).forEach(dfs);
  return cycles;
}
function computeIssues(){
  var issues = [];
  function issue(level, msg, loc, where){
    issues.push({ level:level, msg:msg, loc:loc || { kind:'settings' }, where: where || locLabel(loc) });
  }
  var locations = allQuestLocations();
  var idCount = Object.create(null), idSet = Object.create(null);
  locations.forEach(function(e){
    var id = toStr(e.q.id).trim();
    if(id){ idCount[id] = (idCount[id] || 0) + 1; idSet[id] = 1; }
  });
  var chapterIdCount = Object.create(null);
  state.chapters.forEach(function(ch){ var id = toStr(ch.id).trim(); if(id) chapterIdCount[id] = (chapterIdCount[id] || 0) + 1; });

  /* 设置 */
  var s = state.settings;
  function checkCount(field, len, label){
    var v = s[field];
    var loc = { kind:'settings', field:field };
    if(!isFinite(v)){ issue('error', label + '刷新数量必须是数字', loc, '设置'); return; }
    if(!isNonNegInt(v)){ issue('error', label + '刷新数量必须是非负整数', loc, '设置'); return; }
    if(v > 45){ issue('error', label + '刷新数量必须在 0..45（服务器限制）', loc, '设置'); return; }
    if(len === 0 && v > 0){ issue('error', '模板为空，' + label + '刷新数量必须为 0，否则导出会清空原有设置', loc, '设置'); return; }
    if(len > 0 && v === 0){ issue('error', label + '模板有 ' + len + ' 条，刷新数量不能为 0（导出会覆盖为非空设置）', loc, '设置'); return; }
    if(v > len){ issue('error', label + '刷新数量不能超过模板数量（' + len + ' 条）', loc, '设置'); }
  }
  checkCount('dailyCount', state.daily.length, '每日');
  checkCount('weeklyCount', state.weekly.length, '每周');
  if(!toStr(s.timeZone).trim()){
    issue('warn', '刷新时区不能为空', { kind:'settings', field:'timeZone' }, '设置');
  } else {
    var tzOk = true;
    try { new Intl.DateTimeFormat('en-US', { timeZone:s.timeZone }); } catch(e){ tzOk = false; }
    if(!tzOk) issue('warn', '时区“' + s.timeZone + '”无法被浏览器识别', { kind:'settings', field:'timeZone' }, '设置');
  }

  /* 章节元数据 */
  state.chapters.forEach(function(ch, ci){
    var loc = { kind:'chapter', index:ci, field:'chapter-id' };
    var where = '章节 ' + (ci + 1);
    if(!toStr(ch.id).trim()) issue('error', '章节 ID 不能为空', loc, where);
    else if(chapterIdCount[ch.id.trim()] > 1) issue('error', '章节 ID“' + ch.id + '”重复', loc, where);
    if(!toStr(ch.title).trim()) issue('error', '章节标题不能为空', { kind:'chapter', index:ci, field:'chapter-title' }, where);
    if(!toStr(ch.icon).trim()) issue('warn', '章节未设置图标', { kind:'chapter', index:ci, field:'chapter-icon' }, where);
    else if(!inRegistry('ITEM', ch.icon)) issue('warn', '章节图标“' + ch.icon + '”不在 registry.items 中', { kind:'chapter', index:ci, field:'chapter-icon' }, where);
    if(!ch.quests.length) issue('warn', '章节内还没有任务', { kind:'chapter', index:ci, field:'add-chapter-quest' }, where);
  });

  /* 任务 */
  var cycles = detectCycles();
  locations.forEach(function(entry){
    var q = entry.q, loc = entry.loc, where = locLabel(loc);
    var qid = toStr(q.id).trim();
    if(!qid){
      issue('error', '任务 ID 不能为空', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'id' }, where);
    } else {
      if(!/^[A-Za-z0-9_.-]{1,64}$/.test(qid)) issue('error', '任务 ID 只能使用字母、数字、下划线、点和短横线（1-64 位）', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'id' }, where);
      if(idCount[qid] > 1) issue('error', '任务 ID“' + qid + '”重复，必须全局唯一', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'id' }, where);
    }
    if(!toStr(q.title).trim()) issue('error', '任务标题不能为空', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'title' }, where);
    if(!toStr(q.icon).trim()) issue('warn', '任务未设置图标，服务器可能使用默认物品', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'icon' }, where);
    else if(!inRegistry('ITEM', q.icon)) issue('warn', '图标“' + q.icon + '”不在 registry.items 中', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'icon' }, where);

    if(!q.tasks.length) issue('error', '至少需要一个任务目标', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'add-task' }, where);
    q.tasks.forEach(function(t, ti){
      var tLabel = '目标 ' + (ti + 1);
      var tLoc = { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'task-' + ti + '-type' };
      var trig = triggerMap[t.type];
      if(!toStr(t.type).trim()){ issue('error', tLabel + '：未选择触发器', tLoc, where); }
      else if(!trig){ issue('error', tLabel + '：触发器“' + t.type + '”不在服务器触发器列表中，导入后会被拒绝', tLoc, where); }
      var kind = trig ? trig.targetKind : 'ITEM';
      if(kind !== 'NONE'){
        var targetLoc = { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'task-' + ti + '-target' };
        if(!toStr(t.target).trim()) issue('error', tLabel + '：目标不能为空，可填 * 表示任意', targetLoc, where);
        else if(!inRegistry(kind, t.target)) issue('warn', tLabel + '：' + kindLabel(kind) + '“' + t.target + '”不在 registry 中', targetLoc, where);
      }
      if(!isPosInt(t.amount)) issue('error', tLabel + '：数量必须是正整数', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'task-' + ti + '-amount' }, where);
    });

    if(!q.rewards.length) issue('error', '至少需要一个奖励', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'add-reward' }, where);
    q.rewards.forEach(function(r, ri){
      var rLabel = '奖励 ' + (ri + 1);
      var rLoc = { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'reward-' + ri + '-type' };
      if(!toStr(r.type).trim()){ issue('error', rLabel + '：未选择奖励类型', rLoc, where); return; }
      if(!rewardTypeMap[r.type]){ issue('error', rLabel + '：奖励类型“' + r.type + '”不在服务器奖励列表中，导入后会被拒绝', rLoc, where); }
      if(r.type === 'item'){
        if(!toStr(r.item).trim()) issue('error', rLabel + '：物品不能为空', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'reward-' + ri + '-item' }, where);
        else if(!inRegistry('ITEM', r.item)) issue('warn', rLabel + '：物品“' + r.item + '”不在 registry.items 中', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'reward-' + ri + '-item' }, where);
        if(!isPosInt(r.count)) issue('error', rLabel + '：物品数量必须是正整数', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'reward-' + ri + '-amount' }, where);
        else if(r.count > 2304) issue('error', rLabel + '：物品数量不能超过 2304', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'reward-' + ri + '-amount' }, where);
      } else {
        if(!isPosInt(r.amount)) issue('error', rLabel + '：数量必须是正整数', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'reward-' + ri + '-amount' }, where);
        else if(r.type === 'coin' && r.amount > 1e12) issue('error', rLabel + '：金币数量超出服务器上限', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'reward-' + ri + '-amount' }, where);
        else if(r.type === 'xp' && r.amount > 1000000) issue('error', rLabel + '：经验数量不能超过 1000000', { kind:loc.kind, chapter:loc.chapter, index:loc.index, field:'reward-' + ri + '-amount' }, where);
      }
    });

    if(loc.kind === 'cq'){
      if(!isNonNegInt(q.x) || q.x > 64) issue('error', '网格 X 必须是 0..64 的整数', { kind:'cq', chapter:loc.chapter, index:loc.index, field:'x' }, where);
      if(!isNonNegInt(q.y) || q.y > 64) issue('error', '网格 Y 必须是 0..64 的整数', { kind:'cq', chapter:loc.chapter, index:loc.index, field:'y' }, where);
      (q.requires || []).forEach(function(rid){
        if(rid === q.id){
          issue('error', '任务不能依赖自身', { kind:'cq', chapter:loc.chapter, index:loc.index, field:'requires' }, where);
        } else if(!idSet[rid]){
          issue('error', '前置依赖“' + rid + '”不存在', { kind:'cq', chapter:loc.chapter, index:loc.index, field:'requires' }, where);
        } else {
          var target = null;
          for(var i = 0; i < locations.length; i++){ if(locations[i].q.id === rid){ target = locations[i]; break; } }
          if(target && target.loc.kind !== 'cq') issue('warn', '前置依赖“' + rid + '”不是章节任务，游戏中可能不生效', { kind:'cq', chapter:loc.chapter, index:loc.index, field:'requires' }, where);
        }
      });
      if(cycles[q.id]) issue('error', '前置依赖形成循环：' + cycles[q.id], { kind:'cq', chapter:loc.chapter, index:loc.index, field:'requires' }, where);
    }
  });

  return issues;
}

/* ============================================================
   问题面板
   ============================================================ */
function renderIssues(){
  var issues = computeIssues();
  state.ui.issues = issues;
  var errors = issues.filter(function(i){ return i.level === 'error'; }).length;
  var warns = issues.length - errors;
  var countText = String(issues.length);
  var badge = $('#issuesCount'), badge2 = $('#issuesCount2');
  if(badge) badge.textContent = countText;
  if(badge2) badge2.textContent = countText;
  var toggle = $('#issuesToggle');
  if(toggle){
    toggle.classList.toggle('has-errors', errors > 0);
    toggle.setAttribute('title', errors ? (errors + ' 个错误，' + warns + ' 个警告') : (warns ? (warns + ' 个警告') : '未发现问题'));
  }
  if(!issues.length){
    issuesListEl.innerHTML = '<div class="issues-empty">' + ICONS.check + '未发现问题<br><span class="hint">当前配置可以导出</span></div>';
    return;
  }
  function group(level){
    var list = issues.map(function(it, i){ return { it:it, i:i }; }).filter(function(e){ return e.it.level === level; });
    if(!list.length) return '';
    return '<div class="issue-group"><div class="issue-group-head"><span class="dot' + (level === 'error' ? ' err' : '') + '"></span>' +
      (level === 'error' ? '错误' : '警告') + ' ' + list.length + '</div>' +
      list.map(function(e){
        return '<button class="issue' + (level === 'error' ? ' error' : '') + '" type="button" data-issue="' + e.i + '">' +
          '<span class="issue-icon">' + ICONS.warning + '</span>' +
          '<span class="issue-body"><span class="issue-msg">' + esc(e.it.msg) + '</span>' +
          '<span class="issue-loc">' + esc(e.it.where) + '</span></span></button>';
      }).join('') + '</div>';
  }
  issuesListEl.innerHTML = group('error') + group('warn');
}
function gotoIssue(index){
  var it = state.ui.issues[index];
  if(!it) return;
  var loc = it.loc;
  if(loc.kind === 'settings') state.ui.sel = { kind:'settings' };
  else if(loc.kind === 'daily') state.ui.sel = { kind:'daily', index:loc.index };
  else if(loc.kind === 'weekly') state.ui.sel = { kind:'weekly', index:loc.index };
  else if(loc.kind === 'chapter') state.ui.sel = { kind:'chapter', index:loc.index };
  else if(loc.kind === 'cq') state.ui.sel = { kind:'cq', chapter:loc.chapter, index:loc.index };
  renderNav();
  renderMain(true);
  renderMeta();
  renderIssues();
  requestAnimationFrame(function(){ focusField(loc.field); });
}
function focusField(name){
  if(!name) return;
  var el = document.querySelector('[data-focus="' + String(name).replace(/"/g, '\\"') + '"]');
  if(!el){ mainEl.focus(); return; }
  try { el.scrollIntoView({ block:'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); } catch(e){ el.scrollIntoView(); }
  setTimeout(function(){
    try { el.focus({ preventScroll:true }); } catch(e){ el.focus(); }
    el.classList.add('is-target');
    setTimeout(function(){ el.classList.remove('is-target'); }, 1400);
  }, 30);
}

/* ============================================================
   字段编辑
   ============================================================ */
function resolveEntity(ctx){
  var p = toStr(ctx).split(':');
  if(p[0] === 'settings') return state.settings;
  if(p[0] === 'daily') return state.daily[+p[1]];
  if(p[0] === 'weekly') return state.weekly[+p[1]];
  if(p[0] === 'chapter') return state.chapters[+p[1]];
  if(p[0] === 'cq'){ var ch = state.chapters[+p[1]]; return ch ? ch.quests[+p[2]] : null; }
  return null;
}
function entityFor(el){
  var host = el.closest('[data-ctx]');
  return host ? resolveEntity(host.getAttribute('data-ctx')) : null;
}
function commitField(el){
  var ent = entityFor(el);
  if(!ent) return;
  var field = el.getAttribute('data-field');
  if(!field) return;
  var target = ent;
  if(el.dataset.scope){
    var arr = ent[el.dataset.scope];
    target = arr ? arr[+el.dataset.index] : null;
  }
  if(!target) return;
  var value;
  if(el.type === 'checkbox') value = el.checked;
  else if(el.type === 'number') value = el.value.trim() === '' ? NaN : Number(el.value);
  else value = el.value;
  target[field] = value;

  markDirty();
  scheduleDraft();
  renderIssues();
  if(el.closest('[data-ctx="settings"]')) updateSettingsHints();
  if(field === 'id' || field === 'title') renderNav();
}
function syncTaskRow(row){
  var i = +row.getAttribute('data-task-index');
  var quest = entityFor(row);
  if(!quest || !quest.tasks[i]) return;
  var t = quest.tasks[i];
  var trig = triggerMap[t.type] || null;
  var kind = trig ? trig.targetKind : 'ITEM';
  var cell = row.querySelector('.field-target');
  if(!cell) return;
  if(kind === 'NONE'){
    cell.innerHTML = '<span class="field-label">目标</span><p class="none-note">该触发器无需目标，数量单位为秒</p>';
  } else {
    cell.innerHTML = '<span class="field-label">目标 <span class="subtle mono">' + kindLabel(kind) + '</span></span>' +
      comboHtml(t.target, registryKeyForKind(kind), {
        scope:'tasks', index:i, field:'target', focus:'task-' + i + '-target',
        ariaLabel:'第 ' + (i + 1) + ' 项目标' + kindLabel(kind) + ' ID',
        placeholder: trig && trig.targetHint ? trig.targetHint : '物品 ID、#标签或 *'
      }) +
      '<span class="field-hint">' + esc((trig && trig.targetHint) || '支持 #标签 与 *') + '</span>';
  }
}
function syncRewardRow(row){
  var i = +row.getAttribute('data-reward-index');
  var quest = entityFor(row);
  if(!quest || !quest.rewards[i]) return;
  var r = quest.rewards[i];
  var isItem = r.type === 'item';
  var itemCell = row.querySelector('.field-item');
  var numInput = row.querySelector('.field-amount input');
  var numLabel = row.querySelector('.js-num-label');
  if(itemCell) itemCell.hidden = !isItem;
  if(numInput){
    numInput.setAttribute('data-field', isItem ? 'count' : 'amount');
    numInput.value = isItem ? numAttr(r.count) : numAttr(r.amount);
    numInput.setAttribute('data-focus', 'reward-' + i + '-amount');
  }
  if(numLabel) numLabel.textContent = r.type === 'coin' ? '金币数量' : r.type === 'xp' ? '经验数量' : '物品数量';
}
function syncHiddenTag(el){
  var card = el.closest('.qcard');
  if(!card) return;
  var badges = card.querySelector('.qcard-badges');
  var tag = badges ? badges.querySelector('[data-hidden-tag]') : null;
  if(el.checked && !tag && badges){
    var span = document.createElement('span');
    span.className = 'tag hidden';
    span.setAttribute('data-hidden-tag', '1');
    span.textContent = '隐藏';
    badges.appendChild(span);
  } else if(!el.checked && tag){
    tag.remove();
  }
}
function refreshDerived(el){
  if(el && (el.getAttribute('data-field') === 'hidden' || el.type === 'checkbox')) syncHiddenTag(el);
  renderIssues();
  updateSettingsHints();
  updateDirtyChip();
}

/* ============================================================
   可搜索下拉（物品 / 方块 / 实体）
   ============================================================ */
function registryList(key){
  return key === 'blocks' ? registry.blocks : key === 'entities' ? registry.entities : registry.items;
}
function closeCombo(input){
  var list = input.parentElement ? input.parentElement.querySelector('.combo-list') : null;
  if(list) list.hidden = true;
  input._open = false;
  input._active = -1;
  input.setAttribute('aria-expanded', 'false');
  input.removeAttribute('aria-activedescendant');
}
function closeAllCombos(){
  $$('.combo-input').forEach(function(input){ if(input._open) closeCombo(input); });
}
function renderComboList(input){
  var box = input.parentElement;
  var list = box ? box.querySelector('.combo-list') : null;
  if(!list) return;
  var all = registryList(input.getAttribute('data-registry'));
  var term = input.value.trim().toLowerCase();
  var exact = all.some(function(id){ return id.toLowerCase() === term; });
  var pool;
  if(!term || exact || input._all) pool = all;
  else pool = all.filter(function(id){ return id.toLowerCase().indexOf(term) !== -1; });
  var shown = pool.slice(0, COMBO_LIMIT);
  input._pool = shown;
  input._active = -1;
  input.removeAttribute('aria-activedescendant');
  if(!all.length){
    list.innerHTML = '<li class="combo-empty" role="presentation">没有 registry 数据，可直接手动输入 ID（支持 #标签 与 *）</li>';
    return;
  }
  var rows = shown.map(function(id, i){
    return '<li role="option" id="' + input.id + '-opt-' + i + '" data-value="' + esc(id) + '" aria-selected="' + (id === input.value ? 'true' : 'false') + '">' + esc(id) + '</li>';
  });
  rows.push('<li class="combo-more" role="presentation">共 ' + pool.length + ' 项' + (pool.length > shown.length ? '，已显示前 ' + shown.length + ' 项，继续输入以筛选' : '') + '</li>');
  list.innerHTML = rows.join('');
}
function openCombo(input, forceAll){
  closeAllCombos();
  input._all = !!forceAll;
  renderComboList(input);
  var list = input.parentElement.querySelector('.combo-list');
  list.hidden = false;
  input._open = true;
  input.setAttribute('aria-expanded', 'true');
}
function setActiveOption(input, idx){
  var list = input.parentElement.querySelector('.combo-list');
  if(!list) return;
  var opts = Array.prototype.slice.call(list.querySelectorAll('li[data-value]'));
  if(!opts.length) return;
  if(idx < 0) idx = 0;
  if(idx >= opts.length) idx = opts.length - 1;
  opts.forEach(function(li){ li.classList.remove('is-active'); });
  opts[idx].classList.add('is-active');
  input._active = idx;
  input.setAttribute('aria-activedescendant', opts[idx].id);
}
function chooseOption(input, value){
  if(value == null) return;
  input.value = value;
  input._all = false;
  commitField(input);
  closeCombo(input);
  input.focus();
}
/* ============================================================
   导出 JSON
   ============================================================ */
function questJson(q, inChapter){
  var out = {
    id: toStr(q.id),
    title: toStr(q.title),
    description: toStr(q.description),
    icon: toStr(q.icon),
    tasks: q.tasks.map(function(t){
      var o = { type:toStr(t.type), target:toStr(t.target), amount:t.amount };
      if(toStr(t.display).trim()) o.display = t.display;
      var extras = t._extra || {};
      Object.keys(extras).forEach(function(k){ if(!(k in o)) o[k] = extras[k]; });
      return o;
    }),
    rewards: q.rewards.map(function(r){
      var o;
      if(r.type === 'item') o = { type:'item', item:toStr(r.item), count:r.count };
      else if(r.type === 'coin' || r.type === 'xp') o = { type:r.type, amount:r.amount };
      else {
        o = { type:toStr(r.type) };
        if(isFinite(r.amount)) o.amount = r.amount;
        if(toStr(r.item)){ o.item = r.item; if(isFinite(r.count)) o.count = r.count; }
      }
      var extras = r._extra || {};
      Object.keys(extras).forEach(function(k){ if(!(k in o)) o[k] = extras[k]; });
      return o;
    })
  };
  if(inChapter){
    out.x = isFinite(q.x) ? q.x : 0;
    out.y = isFinite(q.y) ? q.y : 0;
    out.requires = (q.requires || []).slice();
    out.hidden = !!q.hidden;
  }
  var qExtras = q._extra || {};
  Object.keys(qExtras).forEach(function(k){ if(!(k in out)) out[k] = qExtras[k]; });
  return out;
}
function buildExport(){
  var settings = {
    dailyCount: isFinite(state.settings.dailyCount) ? state.settings.dailyCount : 0,
    weeklyCount: isFinite(state.settings.weeklyCount) ? state.settings.weeklyCount : 0,
    timeZone: toStr(state.settings.timeZone)
  };
  Object.keys(state.settings._extra || {}).forEach(function(k){ if(!(k in settings)) settings[k] = state.settings._extra[k]; });
  return {
    settings: settings,
    daily: state.daily.map(function(q){ return questJson(q, false); }),
    weekly: state.weekly.map(function(q){ return questJson(q, false); }),
    chapters: state.chapters.map(function(ch){
      var o = {
        id: toStr(ch.id),
        title: toStr(ch.title),
        description: toStr(ch.description),
        icon: toStr(ch.icon),
        quests: ch.quests.map(function(q){ return questJson(q, true); })
      };
      Object.keys(ch._extra || {}).forEach(function(k){ if(!(k in o)) o[k] = ch._extra[k]; });
      return o;
    })
  };
}
function exportJsonText(){ return JSON.stringify(buildExport(), null, 2) + '\n'; }
function requireValid(){
  var issues = computeIssues();
  state.ui.issues = issues;
  var errors = issues.filter(function(i){ return i.level === 'error'; }).length;
  renderIssues();
  if(errors){
    state.ui.issuesOpen = true;
    applyIssuesVisibility();
    flash('无法导出：还有 ' + errors + ' 个错误需要修复，请查看右侧校验问题面板', 'err');
    return false;
  }
  return true;
}
function doExport(){
  if(!requireValid()) return;
  var issues = state.ui.issues;
  var warns = issues.length;
  var text = exportJsonText();
  var name = 'quests.json';
  try {
    var blob = new Blob([text], { type:'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  } catch(e){
    flash('下载失败：' + e.message + '，请改用“复制 JSON”', 'err');
    return;
  }
  state.ui.lastExportAt = Date.now();
  state.ui.dirty = false;
  saveDraftNow();
  updateSettingsHints();
  updateDirtyChip();
  flash('已导出 ' + name + (warns ? '（含 ' + warns + ' 条警告）' : '') + ' · 覆盖服务器 config/habi_train_survive/quests.json 后执行 /quest reload', 'ok');
}
/* 在线保存：POST 到服务器，服务端会先校验整份定义，失败时不会覆盖 quests.json。 */
var onlineSaving = false;
function saveToServer(){
  if(!ONLINE){ flash('当前是离线编辑器，请使用“导出 quests.json”', 'warn'); return; }
  if(onlineSaving) return;
  if(!requireValid()) return;
  var text = exportJsonText();
  onlineSaving = true;
  var btn = $('#btnOnlineSave');
  if(btn) btn.disabled = true;
  flash('正在保存到服务器…', 'info');
  fetch(ONLINE.endpoint, {
    method:'POST',
    headers:{ 'Content-Type':'application/json;charset=utf-8', 'X-Quest-Token':ONLINE.token },
    body:text
  }).then(function(res){
    return res.text().then(function(body){
      var payload = null;
      try { payload = body ? JSON.parse(body) : null; } catch(e){ payload = null; }
      if(res.ok && payload && payload.success){
        state.ui.dirty = false;
        state.ui.lastExportAt = Date.now();
        saveDraftNow();
        updateDirtyChip();
        flash('已保存到服务器 quests.json 并立即生效', 'ok');
        return;
      }
      var reason = (payload && payload.error) ? payload.error : ('HTTP ' + res.status);
      flash('保存失败，服务器仍使用旧定义：' + reason, 'err');
    });
  }).catch(function(err){
    flash('保存失败：' + (err && err.message ? err.message : '网络错误'), 'err');
  }).then(function(){
    onlineSaving = false;
    if(btn) btn.disabled = false;
  });
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
  ta.remove();
  flash(ok ? '已复制 JSON 到剪贴板 · 保存为 quests.json 后覆盖服务器配置并执行 /quest reload' : '复制失败，请使用“导出 quests.json”下载文件', ok ? 'ok' : 'err');
}
function copyJson(){
  if(!requireValid()) return;
  var text = exportJsonText();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      flash('已复制 JSON 到剪贴板 · 保存为 quests.json 后覆盖服务器配置并执行 /quest reload', 'ok');
    }).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

/* ============================================================
   导入 / 示例数据
   ============================================================ */
function importFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){ importText(String(reader.result || ''), file.name || 'quests.json'); };
  reader.onerror = function(){ flash('无法读取文件：' + (file.name || ''), 'err'); };
  reader.readAsText(file, 'utf-8');
}
function summarizeData(src){
  var d = Array.isArray(src.daily) ? src.daily.length : 0;
  var w = Array.isArray(src.weekly) ? src.weekly.length : 0;
  var cs = Array.isArray(src.chapters) ? src.chapters : [];
  var qc = cs.reduce(function(a, c){ return a + (Array.isArray(c && c.quests) ? c.quests.length : 0); }, 0);
  return '每日 ' + d + ' 条、每周 ' + w + ' 条、章节 ' + cs.length + ' 个（共 ' + qc + ' 个章节任务）';
}
function importText(text, name){
  var data;
  try { data = JSON.parse(text); } catch(err){ flash('JSON 解析失败：' + err.message, 'err'); return; }
  var src = pickQuestSource(data);
  if(!src){ flash('无法识别的 ' + name + '：缺少 settings / daily / weekly / chapters 字段', 'err'); return; }
  var summary = summarizeData(src);
  openModal({
    title: '导入 ' + name,
    body: '将用该文件的 ' + summary + ' 替换当前编辑内容。当前草稿会自动保存，可在设置页放弃草稿恢复。',
    confirmLabel: '导入并替换',
    onConfirm: function(){
      applyQuestData(src);
      state.ui.dirty = true;
      state.ui.issuesOpen = true;
      applyIssuesVisibility();
