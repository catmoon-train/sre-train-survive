   ============================================================ */
var modalPrevFocus = null;
function openModal(opts){
  closeModal(true);
  modalPrevFocus = document.activeElement;
  var danger = !!opts.danger;
  modalRoot.innerHTML = '<div class="modal-backdrop" data-modal-backdrop>' +
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
      '<div class="modal-head"><h2 id="modalTitle">' + esc(opts.title || '确认') + '</h2></div>' +
      '<div class="modal-body">' + (opts.bodyHtml || esc(opts.body || '')) + '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn sm" type="button" data-modal-cancel>' + esc(opts.cancelLabel || '取消') + '</button>' +
        '<button class="btn sm ' + (danger ? 'danger' : 'primary') + '" type="button" data-modal-confirm>' + esc(opts.confirmLabel || '确定') + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  var backdrop = modalRoot.querySelector('.modal-backdrop');
  var cancel = modalRoot.querySelector('[data-modal-cancel]');
  var confirm = modalRoot.querySelector('[data-modal-confirm]');
  cancel.addEventListener('click', function(){ closeModal(); });
  confirm.addEventListener('click', function(){
    var fn = opts.onConfirm;
    closeModal(true);
    if(fn) fn();
  });
  backdrop.addEventListener('mousedown', function(e){ if(e.target === backdrop) closeModal(); });
  requestAnimationFrame(function(){ confirm.focus(); });
}
function closeModal(keepFocus){
  if(!modalRoot.innerHTML) return;
  modalRoot.innerHTML = '';
  if(!keepFocus && modalPrevFocus && document.contains(modalPrevFocus)){
    try { modalPrevFocus.focus(); } catch(e){}
  }
  modalPrevFocus = null;
}
function trapModalFocus(e){
  var modal = modalRoot.querySelector('.modal');
  if(!modal) return;
  var focusables = $$('button, [href], input, select, textarea', modal).filter(function(el){ return !el.disabled; });
  if(!focusables.length) return;
  var first = focusables[0], last = focusables[focusables.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function confirmDanger(title, body, onConfirm, label){
  openModal({ title:title, body:body, confirmLabel:label || '删除', danger:true, onConfirm:onConfirm });
}

function reqChipsHtml(q){

function refreshReqDisabled(){
  var q = currentQuest();
  if(!q) return;
  $$('.req-opt input[data-req-id]').forEach(function(cb){
    var id = cb.getAttribute('data-req-id');
    var label = cb.closest('.req-opt');
    if(cb.checked){
      cb.disabled = false;
      if(label) label.classList.remove('is-cycle');
      cb.removeAttribute('title');
      return;
    }
    var cycle = wouldCycle(id, q.id);
    cb.disabled = cycle;
    if(label) label.classList.toggle('is-cycle', cycle);
    if(cycle) cb.setAttribute('title', '会与当前任务形成循环依赖');
    else cb.removeAttribute('title');
  });
}
function toggleRequire(cb){
  var q = currentQuest();

  if(!id) return;
  if(cb.checked) uniquePush(q.requires, id);
  else q.requires = q.requires.filter(function(r){ return r !== id; });

  scheduleDraft();
  refreshReqChips();
  refreshReqDisabled();

   事件绑定
   ============================================================ */
function handleAction(action, el){
  switch(action){
    case 'import': fileInput.click(); break;
    case 'export': doExport(); break;
    case 'online-save': saveToServer(); break;
    case 'copy': copyJson(); break;
    case 'sample': insertSamples(); break;
    case 'save-draft':
      if(saveDraftNow()) flash('草稿已保存（' + fmtClock(state.ui.draftAt) + '）', 'ok');
      updateSettingsHints();
      break;
    case 'discard-draft': discardDraft(); break;
    case 'clear-draft': clearDraft(); break;
    case 'dismiss-notice': hideNotice(); break;
    case 'add-task': addTask(); break;
    case 'add-reward': addReward(); break;
    case 'add-chapter': addNew('chapter'); break;
    case 'add-chapter-quest':
      if(state.ui.sel.kind === 'chapter') addChapterQuest(state.ui.sel.index);
      else if(state.ui.sel.kind === 'cq') addChapterQuest(state.ui.sel.chapter);
      break;
    case 'back-chapter':
      if(state.ui.sel.kind === 'cq'){
        state.ui.sel = { kind:'chapter', index:state.ui.sel.chapter };
        renderAll(true);
        if(window.innerWidth <= 1024) setNav(false);
      }
      break;
    case 'dup-quest':
      if(state.ui.sel.kind === 'daily') duplicateQuest(state.daily, state.ui.sel.index);
      else if(state.ui.sel.kind === 'weekly') duplicateQuest(state.weekly, state.ui.sel.index);
      else if(state.ui.sel.kind === 'cq') duplicateQuest(state.chapters[state.ui.sel.chapter].quests, state.ui.sel.index, state.ui.sel.chapter);
      break;
    case 'del-quest':
      if(state.ui.sel.kind === 'daily') confirmDeleteQuest('daily', state.ui.sel.index);
      else if(state.ui.sel.kind === 'weekly') confirmDeleteQuest('weekly', state.ui.sel.index);
      else if(state.ui.sel.kind === 'cq') confirmDeleteQuest('cq', state.ui.sel.index, state.ui.sel.chapter);
      break;
    case 'edit-cq': editChapterQuest(pickChapterQuestIndex(el)); break;
  }
}
function bindEvents(){
  document.addEventListener('click', function(e){
    var t = e.target;
    if(!t || !t.closest) return;

    if(t.closest('#backdrop')){ setNav(false); return; }

    var toggle = t.closest('.combo-toggle');
    if(toggle){
      e.preventDefault();
      var input = toggle.parentElement.querySelector('.combo-input');
      if(input){ openCombo(input, true); input.focus(); }
      return;
    }

    var selectEl = t.closest('[data-select]');
    if(selectEl){ selectByKey(selectEl.getAttribute('data-select')); return; }

    var addEl = t.closest('[data-add]');
    if(addEl){ addNew(addEl.getAttribute('data-add')); return; }

    if(t.closest('[data-sample]')){ insertSamples(); return; }

    var moveEl = t.closest('[data-move]');
    if(moveEl){
      var kind = moveEl.getAttribute('data-kind');
      var idx = +moveEl.getAttribute('data-index');
      var delta = moveEl.getAttribute('data-move') === 'up' ? -1 : 1;
      if(kind === 'chapter') moveChapter(idx, delta);
      else moveQuest(kind, idx, delta);
      return;
    }
    var dupEl = t.closest('[data-dup]');
    if(dupEl){
      var p = dupEl.getAttribute('data-dup').split(':');
      var i = +p[1];
      if(p[0] === 'daily') duplicateQuest(state.daily, i);
      else if(p[0] === 'weekly') duplicateQuest(state.weekly, i);
      else if(p[0] === 'chapter') duplicateChapter(i);
      return;
    }
    var delEl = t.closest('[data-del]');
    if(delEl){
      state.ui.confirmDelete = delEl.getAttribute('data-del');
      renderNav();
      return;
    }
    var confirmDel = t.closest('[data-confirm-delete]');
    if(confirmDel){
      var parts = confirmDel.getAttribute('data-confirm-delete').split(':');
      state.ui.confirmDelete = null;
      var ci = +parts[1];
      if(parts[0] === 'daily' || parts[0] === 'weekly') deleteQuest(state[parts[0]], ci, parts[0]);
      else if(parts[0] === 'chapter') deleteChapterNow(ci);
      return;
    }
    if(t.closest('[data-cancel-delete]')){ state.ui.confirmDelete = null; renderNav(); return; }

    var chMove = t.closest('[data-ch-move]');
    if(chMove){ moveChapter(+chMove.getAttribute('data-index'), chMove.getAttribute('data-ch-move') === 'up' ? -1 : 1); return; }
    var chDup = t.closest('[data-ch-dup]');
    if(chDup){ duplicateChapter(+chDup.getAttribute('data-ch-dup')); return; }
    var chDel = t.closest('[data-ch-del]');
    if(chDel){ confirmDeleteChapter(+chDel.getAttribute('data-ch-del')); return; }
    var editCh = t.closest('[data-edit-chapter]');
    if(editCh){ state.ui.sel = { kind:'chapter', index:+editCh.getAttribute('data-edit-chapter') }; renderAll(true); return; }

    var cqMove = t.closest('[data-cq-move]');
    if(cqMove){ moveChapterQuest(cqMove.getAttribute('data-cq-move') === 'up' ? -1 : 1, +cqMove.getAttribute('data-index')); return; }
    var cqDup = t.closest('[data-cq-dup]');
    if(cqDup){
      var qi = +cqDup.getAttribute('data-cq-dup');
      var sel = state.ui.sel;
      if(sel.kind === 'chapter'){ duplicateQuest(state.chapters[sel.index].quests, qi, sel.index); }
      return;
    }
    var cqDel = t.closest('[data-cq-del]');
    if(cqDel){
      var qdi = +cqDel.getAttribute('data-cq-del');
      var s2 = state.ui.sel;
      if(s2.kind === 'chapter') confirmDeleteQuest('cq', qdi, s2.index);
      return;
    }
    var editCq = t.closest('[data-action="edit-cq"]');
    if(editCq){ editChapterQuest(pickChapterQuestIndex(editCq)); return; }

    var rmTask = t.closest('[data-remove-task]');
    if(rmTask){ removeTask(+rmTask.getAttribute('data-remove-task')); return; }
    var rmReward = t.closest('[data-remove-reward]');
    if(rmReward){ removeReward(+rmReward.getAttribute('data-remove-reward')); return; }
    var rmReq = t.closest('[data-remove-require]');
    if(rmReq){
      var q = currentQuest();
      if(q){
        var rid = rmReq.getAttribute('data-remove-require');
        q.requires = q.requires.filter(function(r){ return r !== rid; });
        markDirty();
        saveDraftNow();
        refreshReqChips();
        refreshReqDisabled();
        renderIssues();
        flash('已移除前置依赖 ' + rid, 'ok');
      }
      return;
    }

    var actionEl = t.closest('[data-action]');
    if(actionEl){ handleAction(actionEl.getAttribute('data-action'), actionEl); return; }

    var issueEl = t.closest('[data-issue]');
    if(issueEl){ gotoIssue(+issueEl.getAttribute('data-issue')); return; }

    var chip = t.closest('.gchip');
    if(chip){
      state.ui.gridPick = +chip.getAttribute('data-gchip');
      renderChapterGrid();
      flash('已选中任务，点击网格中的空格完成放置', 'info');
      return;
    }
    var cell = t.closest('.gcell');
    if(cell && state.ui.sel.kind === 'chapter' && state.ui.gridPick != null){
      var xy = cell.getAttribute('data-cell').split(',');
      setQuestPosition(state.ui.gridPick, +xy[0], +xy[1]);
      return;
    }

    // 点击组合框输入框时展开列表
    if(t.closest('.combo-input') && !t.closest('.combo-input')._open){
      openCombo(t.closest('.combo-input'), false);
    }
  });

  document.addEventListener('input', function(e){
    var el = e.target;
    if(!el || !el.matches) return;
    if(el === searchInput){ state.ui.search = el.value; renderNav(); return; }
    if(el.matches('.combo-input')){
      if(el._open){ el._all = false; renderComboList(el); }
      commitField(el);
      return;
    }
    if(el.matches('[data-req-filter]')){ filterRequires(el.value); return; }
    if(el.matches('[data-field]')) commitField(el);
  });

  document.addEventListener('change', function(e){
    var el = e.target;
    if(!el || !el.matches) return;
    if(el.matches('[data-req-id]')){ toggleRequire(el); return; }
    if(!el.matches('[data-field]')) return;
    commitField(el);
    var field = el.getAttribute('data-field');
    if(field === 'type'){
      var taskRow = el.closest('.task-row');
      if(taskRow) syncTaskRow(taskRow);
      var rewardRow = el.closest('.reward-row');
      if(rewardRow) syncRewardRow(rewardRow);
    }
    if(field === 'hidden') syncHiddenTag(el);
    if(field === 'x' || field === 'y'){
      var card = el.closest('.qcard');
      if(card && state.ui.sel.kind === 'chapter'){
        syncCardPositions();
        renderChapterGrid();
      } else if(state.ui.sel.kind === 'cq'){
        renderNav();
      }
    }
  });

  document.addEventListener('mousedown', function(e){
    var opt = e.target.closest('.combo-list li[data-value]');
    if(opt){
      e.preventDefault();
      var input = opt.closest('.combo').querySelector('.combo-input');
      chooseOption(input, opt.getAttribute('data-value'));
      return;
    }
    if(!e.target.closest('.combo')) closeAllCombos();
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(modalRoot.querySelector('.modal')){
        closeModal();
        return;
      }
      if(document.body.classList.contains('nav-open')){ setNav(false); return; }
      if(document.querySelector('.combo-input[aria-expanded="true"]')){ closeAllCombos(); return; }
    }
    var input = e.target.closest ? e.target.closest('.combo-input') : null;
    if(input){
      var list = input.parentElement.querySelector('.combo-list');
      if(!input._open){
        if(e.key === 'ArrowDown' || e.key === 'Enter'){ e.preventDefault(); openCombo(input, false); }
        return;
      }
      var options = Array.prototype.slice.call(list.querySelectorAll('li[data-value]'));
      var idx = input._active == null ? -1 : input._active;
      if(e.key === 'ArrowDown'){ e.preventDefault(); setActiveOption(input, idx + 1); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); setActiveOption(input, idx - 1); }
      else if(e.key === 'Enter'){
        if(idx >= 0 && options[idx]){ e.preventDefault(); chooseOption(input, options[idx].getAttribute('data-value')); }
      } else if(e.key === 'Tab'){ closeCombo(input); }
      return;
    }
    if(e.key === 'Tab') trapModalFocus(e);
  });

  document.addEventListener('dragstart', function(e){
    var chip = e.target.closest ? e.target.closest('.gchip') : null;
    if(!chip) return;
    state.ui.dragQuest = +chip.getAttribute('data-gchip');
    try {
      e.dataTransfer.setData('text/plain', String(state.ui.dragQuest));
      e.dataTransfer.effectAllowed = 'move';
    } catch(err){}
  });
  document.addEventListener('dragover', function(e){
    var cell = e.target.closest ? e.target.closest('.gcell') : null;
    if(cell && state.ui.dragQuest != null){
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'move'; } catch(err){}
      $$('.gcell.is-over').forEach(function(c){ c.classList.remove('is-over'); });
      cell.classList.add('is-over');
      return;
    }
    if(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1){
      e.preventDefault();
      dropOverlay.hidden = false;
    }
  });
  document.addEventListener('dragleave', function(e){
    var cell = e.target.closest ? e.target.closest('.gcell') : null;
    if(cell) cell.classList.remove('is-over');
  });
  document.addEventListener('dragend', function(){
    state.ui.dragQuest = null;
    $$('.gcell.is-over').forEach(function(c){ c.classList.remove('is-over'); });
    dropOverlay.hidden = true;
  });
  document.addEventListener('drop', function(e){
    var cell = e.target.closest ? e.target.closest('.gcell') : null;
    if(cell && state.ui.dragQuest != null){
      e.preventDefault();
      var idx = state.ui.dragQuest;
      state.ui.dragQuest = null;
      var xy = cell.getAttribute('data-cell').split(',');
      $$('.gcell.is-over').forEach(function(c){ c.classList.remove('is-over'); });
      setQuestPosition(idx, +xy[0], +xy[1]);
      return;
    }
    var files = e.dataTransfer && e.dataTransfer.files;
    if(files && files.length){
      e.preventDefault();
      dropOverlay.hidden = true;
      importFile(files[0]);
    }
    state.ui.dragQuest = null;
  });
  document.addEventListener('dragenter', function(e){
    if(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1){
      dropOverlay.hidden = false;
    }
  });

  fileInput.addEventListener('change', function(){
    var file = fileInput.files && fileInput.files[0];
    if(file) importFile(file);
    fileInput.value = '';
  });

  $('#navToggle').addEventListener('click', function(){ setNav(!document.body.classList.contains('nav-open')); });
  $('#issuesToggle').addEventListener('click', function(){
    state.ui.issuesOpen = !state.ui.issuesOpen;
    applyIssuesVisibility();
  });

  window.addEventListener('beforeunload', function(e){
    if(!state.ui.dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });
}
function deleteChapterNow(ci){
  var ch = state.chapters[ci];
  if(!ch) return;
  var title = ch.title || ch.id || '未命名章节';
  var ids = ch.quests.map(function(q){ return q.id; }).filter(Boolean);
  state.chapters.splice(ci, 1);
  var cleaned = ids.length ? cleanupRequires(ids) : 0;
  if(state.ui.sel.kind === 'chapter' || state.ui.sel.kind === 'cq'){
    if(state.ui.sel.kind === 'cq' && state.ui.sel.chapter !== ci) { /* 保持 */ }
    else state.ui.sel = state.chapters.length ? { kind:'chapter', index:Math.min(ci, state.chapters.length - 1) } : { kind:'chapters' };
  }
  state.ui.dirty = true;
  renderAll(true);
  saveDraftNow();
  flash('已删除章节“' + title + '”' + (cleaned ? '，并清理 ' + cleaned + ' 处前置依赖' : ''), 'ok');
}
function confirmDeleteChapter(ci){
  var ch = state.chapters[ci];
  if(!ch) return;
  confirmDanger('删除章节', '确定删除章节“' + (ch.title || ch.id || '未命名章节') + '”及其 ' + ch.quests.length + ' 个任务？相关前置依赖会被清理。', function(){
    deleteChapterNow(ci);
  });
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  initIcons();
  var onlineBtn = $('#btnOnlineSave');
  if(onlineBtn && ONLINE) onlineBtn.hidden = false;
  var stored = ONLINE ? null : readDraft();
  if(stored && stored.data){
    applyQuestData(stored.data);
    state.ui.draftAt = stored.savedAt || null;
    state.ui.draftRestored = true;
    state.ui.dirty = true;
  } else {
    applyQuestData(pickQuestSource(BUNDLE) || {});
  }
  bindEvents();
  applyIssuesVisibility();
  renderAll();
  updateDirtyChip();
  if(state.ui.draftRestored){
    showNotice('已恢复本地草稿（' + (state.ui.draftAt ? fmtClock(state.ui.draftAt) : '时间未知') + '），它可能与服务器注入的数据不同。');
    flash('已恢复本地草稿；如需服务器数据，请点击“放弃本地草稿，重新载入服务器数据”。', 'warn');
  } else if(!BUNDLE){
    flash('未注入服务器数据（QUEST_BUNDLE 为 null）：当前为空配置，可导入 quests.json 或插入示例任务。', 'warn');
  } else if(ONLINE){
    flash('在线编辑：当前载入服务器最新任务（每日 ' + state.daily.length + ' / 每周 ' + state.weekly.length + ' / 章节 ' + state.chapters.length + '），点击“保存到服务器”直接写回 quests.json。', 'info');
  } else {
    flash('已载入服务器数据：每日 ' + state.daily.length + ' / 每周 ' + state.weekly.length + ' / 章节 ' + state.chapters.length + '。', 'info');
  }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
